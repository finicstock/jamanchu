<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8725c" />
    <title>자만추 - 연결 대기 중</title>
    <style>
      :root {
        color: #2d2520;
        background: #fbf7ef;
        font-family:
          -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR",
          system-ui, sans-serif;
      }
      body {
        min-height: 100dvh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        width: min(100%, 390px);
        border: 1px solid #eadfd4;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 16px 48px rgba(45, 37, 32, 0.08);
        padding: 28px;
      }
      .mark {
        width: 52px;
        height: 52px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #fbe4dd;
        color: #e8725c;
        font-size: 26px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 25px;
        line-height: 1.25;
      }
      p {
        margin: 0;
        color: #6f635a;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        margin-top: 22px;
        color: #fff;
        background: #e8725c;
        border-radius: 999px;
        padding: 12px 18px;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark">♡</div>
      <h1>잠시 연결을 기다리고 있어요</h1>
      <p>
        네트워크가 돌아오면 자만추가 이어서 열립니다. 이미 열어둔 화면 일부는 홈
        화면 앱에서 계속 확인할 수 있어요.
      </p>
      <a href="/">다시 열기</a>
    </main>
  </body>
</html>
